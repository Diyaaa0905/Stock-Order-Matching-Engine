<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apex Stock Trading Exchange Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Apex Trader">
  <title>Apex Trader</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0B0E14;
      margin: 0;
      padding: 0;
    }
    #loading-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #00C087;
    }
    #loading-screen p {
      color: #848E9C;
      margin-top: 8px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2A2E39;
      border-top-color: #00C087;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <h2 style="margin-top:16px">Apex Stock Exchange</h2>
    <p>Loading trading interface...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
